name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Native packages: Linux (AppImage + .deb + .rpm, x86_64 + arm64), Windows (NSIS), macOS (DMG) ──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: .deb / .rpm only. AppImage is NOT built in CI — see
          # AGENTS.md "Known Issue #5". Every attempt to ship an AppImage
          # has broken in some new way (FUSE namespace WebKit crash, unsquashfs
          # superblock detection failing on the runner, tauri-action overwriting
          # the post-build conversion, etc). The .deb / .rpm / AUR paths don't
          # hit any of those because they install through the distro's package
          # manager. If you want an AppImage for a one-off, run
          #   cargo tauri build --bundles appimage
          # in the source tree and accept the FUSE issues for now.
          - platform: ubuntu-24.04
            args: --bundles deb,rpm
            arch: linux-x86_64
          - platform: ubuntu-24.04-arm
            args: --bundles deb,rpm
            arch: linux-arm64
          - platform: windows-latest
            args: ''
            arch: windows
          # macos-13 (Intel) runners are retired — build Intel via cross-target
          # on an Apple Silicon runner instead.
          - platform: macos-14
            args: --target x86_64-apple-darwin
            arch: macos-x86_64
          - platform: macos-14
            args: ''
            arch: macos-aarch64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Intel macOS cross-compile target
        if: matrix.arch == 'macos-x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev clang libclang-dev \
            file squashfs-tools libpipewire-0.3-dev libgbm-dev libdrm-dev \
            rpm xz-utils zstd xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version (asset names use the bare version, no "v")
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %s" --reverse)
          else
            COMMITS=$(git log "$PREV_TAG".."$TAG_NAME" --oneline --pretty=format:"- %s" --reverse)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- FrameXShot initial release"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable binary stripping in linuxdeploy's bundled GNU strip 2.35.
          # Arch / CachyOS libraries contain .relr.dyn RELR relocations that
          # strip 2.35 (2021) does not understand and corrupts. NO_STRIP=1 is
          # the official linuxdeploy env var that skips the strip pass entirely.
          # The strip in Cargo.toml [profile.release] still runs (that uses the
          # host's strip, which is new enough on the Ubuntu 24.04 runner).
          NO_STRIP: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FrameXShot ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads & Installation

            | Platform | Package | Notes |
            |----------|---------|-------|
            | **Linux (x86_64)** | `.deb`, `.rpm` | distro-native install |
            | **Linux (arm64)** | `.deb`, `.rpm` | Raspberry Pi / Asahi / etc. |
            | **Windows** | `*_x64-setup.exe` | standard installer |
            | **macOS (Intel)** | `*_x64.dmg` | macOS 10.15+ |
            | **macOS (Apple Silicon)** | `*_aarch64.dmg` | macOS 10.15+ |

            ### Linux — pick what fits your distro

            **Debian / Ubuntu / Pop!_OS / Mint / Elementary:**
            ```sh
            sudo apt install ./framexshot_${{ env.APP_VERSION }}_amd64.deb
            ```

            **Fedora / RHEL / Nobara / openSUSE:**
            ```sh
            sudo dnf install ./framexshot_${{ env.APP_VERSION }}_x86_64.rpm
            ```

            **Arch / Manjaro / EndeavourOS (AUR — recommended):**
            ```sh
            yay -S framexshot
            ```

            **Any other distro (builds from source against your system libs):**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/sahilcodexx/framexshot/main/packaging/install.sh | sh
            ```

            ### Windows
            ```sh
            framexshot_${{ env.APP_VERSION }}_x64-setup.exe
            ```

            ### macOS (Apple Silicon)
            ```sh
            open framexshot_${{ env.APP_VERSION }}_aarch64.dmg
            ```

            ### macOS (Intel)
            ```sh
            open framexshot_${{ env.APP_VERSION }}_x64.dmg
            ```

            ## What's New
            ${{ steps.release_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ── AppImage: build + patch runtime for fuse2/fuse3/no-FUSE compatibility ─────────
  # The standard Tauri AppImage runtime requires libfuse2. Modern Arch/CachyOS
  # ships libfuse3 only, so double-clicking the unpatched AppImage fails.
  # Fix: after building, locate the squashfs payload (magic bytes 'hsqs'), then
  # prepend the AppImage/type2-runtime binary which supports fuse2, fuse3, AND
  # an extract-and-run fallback when FUSE is completely unavailable.
  # This job is best-effort — failure does not block the deb/rpm/dmg release.
  appimage:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev \
            squashfs-tools file

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AppImage
        env:
          # Prevent linuxdeploy's bundled strip 2.35 from corrupting modern
          # Arch/CachyOS ELF binaries that contain .relr.dyn RELR relocations.
          NO_STRIP: "1"
        run: cargo tauri build --locked --bundles appimage

      - name: Patch AppImage runtime (fuse2 + fuse3 + extract fallback)
        shell: bash
        run: |
          set -euo pipefail

          APPIMAGE=$(find src-tauri/target/release/bundle/appimage \
            -name "*.AppImage" 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage produced by the build step"
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE ($(stat -c%s "$APPIMAGE") bytes)"

          # Download the type2-runtime which supports:
          #   libfuse2   — original AppImages
          #   libfuse3   — modern Arch / CachyOS
          #   extract    — APPIMAGE_EXTRACT_AND_RUN=1 fallback (no FUSE at all)
          RUNTIME_URL="https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          curl -fsSL "$RUNTIME_URL" -o /tmp/runtime-new
          chmod +x /tmp/runtime-new
          echo "Downloaded new runtime: $(stat -c%s /tmp/runtime-new) bytes"

          # The AppImage format is:  [ runtime binary ][ squashfs filesystem ]
          # Squashfs magic on little-endian x86: 'hsqs' = 0x68 0x73 0x71 0x73
          # We find this offset, slice off the runtime, and prepend the new one.
          # (YAML literal-block rules mean we can't use a heredoc inside `run: |`
          # — `<<` would be parsed as a merge key — so we write the script to a
          # temp file first and run it from there.)
          cat > /tmp/find-squashfs.py << 'PYEOF'
import sys
with open(sys.argv[1], 'rb') as f:
    data = f.read(8 * 1024 * 1024)   # scan first 8 MB
offset = data.find(b'hsqs')
if offset <= 0:
    print(-1)
else:
    print(offset)
PYEOF
          SQ_OFFSET=$(python3 /tmp/find-squashfs.py "$APPIMAGE")

          if [ "$SQ_OFFSET" -le 0 ]; then
            echo "ERROR: squashfs magic 'hsqs' not found in AppImage"
            exit 1
          fi
          echo "Squashfs starts at byte offset: $SQ_OFFSET"

          # Rebuild: new runtime binary + original squashfs payload.
          # 'tail -c +N' starts reading at the Nth byte (1-indexed),
          # so +((SQ_OFFSET+1)) skips the old runtime exactly.
          PATCHED=/tmp/framexshot-patched.AppImage
          {
            cat /tmp/runtime-new
            tail -c "+$((SQ_OFFSET + 1))" "$APPIMAGE"
          } > "$PATCHED"
          chmod +x "$PATCHED"

          ORIG_SIZE=$(stat -c%s "$APPIMAGE")
          PATCH_SIZE=$(stat -c%s "$PATCHED")
          echo "Original size: $ORIG_SIZE  Patched size:  $PATCH_SIZE"

          # Sanity check: sizes should be close (only the runtime changed)
          DELTA=$(( PATCH_SIZE - ORIG_SIZE ))
          ABSDELTA=${DELTA#-}
          if [ "$ABSDELTA" -gt $((2 * 1024 * 1024)) ]; then
            echo "ERROR: size delta ${DELTA} bytes is suspiciously large; aborting"
            exit 1
          fi

          cp "$PATCHED" "$APPIMAGE"
          echo "Runtime patched successfully: $APPIMAGE"

      - name: Resolve app version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Upload AppImage to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage \
            -name "*.AppImage" 2>/dev/null | head -1)
          gh release upload "${{ github.ref_name }}" "$APPIMAGE" --clobber

  # ── Build Flatpak bundle (universal Linux — bundles WebKitGTK via GNOME runtime) ──
  # Decoupled from publish: failure here will not block the AppImage/deb/rpm/dmg
  # release. Flatpak gets uploaded as a separate best-effort artifact.
  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev clang libclang-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev \
            ccache flatpak flatpak-builder

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version (asset names use the bare version, no "v")
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build frontend
        run: pnpm run build

      - name: Build Rust binary
        # cargo build embeds dist/ via generate_context!() at compile time.
        # The resulting binary is self-contained (frontend assets baked in).
        # --locked protects the committed Cargo.lock; --frozen (offline) is
        # avoided because fresh runners lack a cached crates.io index.
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      # Cache the GNOME SDK/Platform runtimes — first run ~2 GB download, then instant.
      # GNOME 49 platform: 48 is EOL (2026-04-11) — bump both the version AND
      # the cache key together or the stale cache will be reused.
      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-gnome-platform-49-v1

      # Cache Flatpak sources + ccache between runs.
      - name: Cache Flatpak build state
        uses: actions/cache@v4
        with:
          path: ~/.cache/flatpak-builder
          key: flatpak-builder-cache-49-${{ hashFiles('flatpak/**', 'src-tauri/Cargo.lock') }}

      - name: Install GNOME Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49

      - name: Verify shared-modules recipe is vendored
        run: |
          test -f flatpak/shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json \
            || { echo "flatpak/shared-modules/ must be committed (see AGENTS.md Change 21)"; exit 1; }

      - name: Build Flatpak bundle
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --ccache \
            --repo=flatpak-repo \
            flatpak-build-dir \
            flatpak/com.framexshot.app.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak \
            com.framexshot.app

      - name: Validate Flatpak bundle
        run: |
          test -f framexshot_${{ env.APP_VERSION }}_amd64.flatpak
          flatpak install --user --noninteractive -y \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak
          flatpak info --show-ref com.framexshot.app

      - name: Upload Flatpak to release (best-effort)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak \
            --clobber || echo "Flatpak upload failed; release was still published."

  # ── Publish draft → public release ───────────────────────────────────────
  # Publishes as soon as the native build matrix succeeds. Flatpak is
  # best-effort (continue-on-error) and uploads separately when ready.
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const tagName = context.ref.replace('refs/tags/', '');
            const draftRelease = releases.find(r => r.draft && r.tag_name === tagName);

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                draft: false,
              });
              console.log(`Published release: ${draftRelease.html_url}`);
            } else {
              console.log(`No draft release found for tag: ${tagName}`);
            }
