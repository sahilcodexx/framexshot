name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Native packages: Linux (AppImage + .deb + .rpm, x86_64 + arm64), Windows (NSIS), macOS (DMG) ──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: .deb / .rpm in the matrix job; AppImage is built separately in the
          # `appimage` job (best-effort) with post-build stripping of bundled
          # Wayland/GL libs so rolling distros use their system copies.
          - platform: ubuntu-24.04
            args: --bundles deb,rpm
            arch: linux-x86_64
          - platform: ubuntu-24.04-arm
            args: --bundles deb,rpm
            arch: linux-arm64
          - platform: windows-latest
            args: ''
            arch: windows
          # macos-13 (Intel) runners are retired — build Intel via cross-target
          # on an Apple Silicon runner instead.
          - platform: macos-14
            args: --target x86_64-apple-darwin
            arch: macos-x86_64
          - platform: macos-14
            args: ''
            arch: macos-aarch64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Intel macOS cross-compile target
        if: matrix.arch == 'macos-x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev clang libclang-dev \
            file squashfs-tools libpipewire-0.3-dev libgbm-dev libdrm-dev \
            rpm xz-utils zstd xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version (asset names use the bare version, no "v")
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %s" --reverse)
          else
            COMMITS=$(git log "$PREV_TAG".."$TAG_NAME" --oneline --pretty=format:"- %s" --reverse)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- FrameXShot initial release"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable binary stripping in linuxdeploy's bundled GNU strip 2.35.
          # Arch / CachyOS libraries contain .relr.dyn RELR relocations that
          # strip 2.35 (2021) does not understand and corrupts. NO_STRIP=1 is
          # the official linuxdeploy env var that skips the strip pass entirely.
          # The strip in Cargo.toml [profile.release] still runs (that uses the
          # host's strip, which is new enough on the Ubuntu 24.04 runner).
          NO_STRIP: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FrameXShot ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads & Installation

            | Platform | Package | Notes |
            |----------|---------|-------|
            | **Linux (x86_64)** | `.deb`, `.rpm`, `.AppImage` | AppImage for universal use; deb/rpm for distro-native install |
            | **Linux (arm64)** | `.deb`, `.rpm` | Raspberry Pi / Asahi / etc. |
            | **Windows** | `*_x64-setup.exe` | standard installer |
            | **macOS (Intel)** | `*_x64.dmg` | macOS 10.15+ |
            | **macOS (Apple Silicon)** | `*_aarch64.dmg` | macOS 10.15+ |

            ### Linux — pick what fits your distro

            **Debian / Ubuntu / Pop!_OS / Mint / Elementary:**
            ```sh
            sudo apt install ./framexshot_${{ env.APP_VERSION }}_amd64.deb
            ```

            **Fedora / RHEL / Nobara / openSUSE:**
            ```sh
            sudo dnf install ./framexshot_${{ env.APP_VERSION }}_x86_64.rpm
            ```

            **Arch / Manjaro / EndeavourOS (AUR — recommended):**
            ```sh
            yay -S framexshot
            ```

            **Any other distro (AppImage — no install needed):**
            ```sh
            chmod +x framexshot_${{ env.APP_VERSION }}_amd64.AppImage
            ./framexshot_${{ env.APP_VERSION }}_amd64.AppImage
            ```

            **Any other distro (builds from source against your system libs):**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/sahilcodexx/framexshot/main/packaging/install.sh | sh
            ```

            ### Windows
            ```sh
            framexshot_${{ env.APP_VERSION }}_x64-setup.exe
            ```

            ### macOS (Apple Silicon)
            ```sh
            open framexshot_${{ env.APP_VERSION }}_aarch64.dmg
            ```

            ### macOS (Intel)
            ```sh
            open framexshot_${{ env.APP_VERSION }}_x64.dmg
            ```

            ## What's New
            ${{ steps.release_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ── AppImage: build + strip version-coupled Wayland/GL libs for rolling distros ──
  # linuxdeploy-plugin-gtk copies Ubuntu 24.04's libwayland 1.21 into the AppImage.
  # On rolling distros (Arch/CachyOS) system Mesa 25.x expects libwayland 1.26+;
  # the mismatch makes EGL succeed silently but wl_buffer never displays → blank
  # window. Fix: delete those bundled .so files so the dynamic linker uses the
  # system's copies, then repack squashfs while preserving the ELF runtime prefix.
  # This job is best-effort — failure does not block the deb/rpm/dmg release.
  appimage:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev \
            squashfs-tools file

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AppImage
        env:
          # Prevent linuxdeploy's bundled strip 2.35 from corrupting modern
          # Arch/CachyOS ELF binaries that contain .relr.dyn RELR relocations.
          NO_STRIP: "1"
        # Use pnpm tauri build (matches the matrix build) — the runner doesn't
        # have cargo-tauri installed, so `cargo tauri build` fails with
        # `error: no such command: \`tauri\``.
        # `--locked` is a `cargo build` flag and not a `tauri build` option, so
        # it must not be passed through to the JS Tauri CLI.
        run: pnpm exec tauri build --bundles appimage

      - name: Patch AppImage (strip bundled Wayland/GL libs)
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage \
            -name "*.AppImage" 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage produced by the build step"
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE ($(stat -c%s "$APPIMAGE") bytes)"
          file "$APPIMAGE"

          # Squashfs offset from the embedded type-2 runtime (avoids false-positive
          # 'hsqs' matches inside the ELF .data section).
          OFFSET=$("$APPIMAGE" --appimage-offset)
          if [ -z "$OFFSET" ] || [ "$OFFSET" -le 0 ] 2>/dev/null; then
            echo "ERROR: --appimage-offset returned invalid value: '$OFFSET'"
            exit 1
          fi
          echo "Squashfs offset: $OFFSET bytes"

          WORKDIR=$(mktemp -d)
          cleanup() { rm -rf "$WORKDIR" squashfs-root; }
          trap cleanup EXIT

          # Extract root filesystem
          "$APPIMAGE" --appimage-extract >/dev/null

          # Read compression settings from the original squashfs payload so the
          # repacked image matches what linuxdeploy produced.
          dd if="$APPIMAGE" of="$WORKDIR/orig.sqfs" bs="$OFFSET" skip=1 status=none
          SQFS_INFO=$(unsquashfs -s "$WORKDIR/orig.sqfs" 2>&1)
          echo "$SQFS_INFO"
          BLOCK_SIZE=$(echo "$SQFS_INFO" | sed -n 's/^Block size \([0-9]*\)$/\1/p')
          BLOCK_SIZE=${BLOCK_SIZE:-131072}
          # linuxdeploy produces xz-compressed squashfs by default. xz gives
          # the best ratio but requires squashfs-tools >= 4.4 to read, and
          # many distros ship older versions (Arch, CachyOS) that only
          # support zlib and zstd. AppImageLauncher on those distros then
          # fails with "Failed to extract metadata during installation".
          # We force zstd: every squashfs 4.0+ tool reads it, the size
          # penalty vs xz is ~3% on this kind of payload, and decode is
          # ~5x faster — which matters for AppImage startup time.
          COMP=zstd
          COMP_ARGS=(-comp "$COMP" -Xcompression-level 15)

          # Delete version-coupled graphics/Wayland libs — rolling distros must
          # use their own (newer) system copies. Stable ABI; always present.
          STRIP_LIBS=(
            libwayland-client.so.0
            libwayland-server.so.0
            libwayland-cursor.so.0
            libwayland-egl.so.1
            libgbm.so.1
            libEGL.so.1
            libGL.so.1
            libGLX.so.0
            libGLdispatch.so.0
            libdrm.so.2
          )
          for lib in "${STRIP_LIBS[@]}"; do
            while IFS= read -r -d '' path; do
              echo "  removing $path"
              rm -f "$path"
            done < <(find squashfs-root \( -name "$lib" -o -name "${lib}."* \) -print0)
          done

          mksquashfs squashfs-root "$WORKDIR/new.sqfs" \
            -noappend -root-owned -b "$BLOCK_SIZE" "${COMP_ARGS[@]}" -quiet

          # Reassemble: [original ELF runtime prefix][new squashfs payload]
          dd if="$APPIMAGE" of="${APPIMAGE}.patched" bs="$OFFSET" count=1 status=none
          cat "$WORKDIR/new.sqfs" >> "${APPIMAGE}.patched"
          chmod +x "${APPIMAGE}.patched"
          mv "${APPIMAGE}.patched" "$APPIMAGE"

          echo "Patched AppImage: $(stat -c%s "$APPIMAGE") bytes"
          file "$APPIMAGE"
          "$APPIMAGE" --appimage-offset >/dev/null
          echo "AppImage patch complete."

      - name: Resolve app version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Upload AppImage to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage \
            -name "*.AppImage" 2>/dev/null | head -1)
          gh release upload "${{ github.ref_name }}" "$APPIMAGE" --clobber

  # ── Build Flatpak bundle (universal Linux — bundles WebKitGTK via GNOME runtime) ──
  # Decoupled from publish: failure here will not block the AppImage/deb/rpm/dmg
  # release. Flatpak gets uploaded as a separate best-effort artifact.
  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev clang libclang-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev \
            ccache flatpak flatpak-builder

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version (asset names use the bare version, no "v")
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build frontend
        run: pnpm run build

      - name: Build Rust binary
        # cargo build embeds dist/ via generate_context!() at compile time.
        # The resulting binary is self-contained (frontend assets baked in).
        # --locked protects the committed Cargo.lock; --frozen (offline) is
        # avoided because fresh runners lack a cached crates.io index.
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      # Cache the GNOME SDK/Platform runtimes — first run ~2 GB download, then instant.
      # GNOME 49 platform: 48 is EOL (2026-04-11) — bump both the version AND
      # the cache key together or the stale cache will be reused.
      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-gnome-platform-49-v1

      # Cache Flatpak sources + ccache between runs.
      - name: Cache Flatpak build state
        uses: actions/cache@v4
        with:
          path: ~/.cache/flatpak-builder
          key: flatpak-builder-cache-49-${{ hashFiles('flatpak/**', 'src-tauri/Cargo.lock') }}

      - name: Install GNOME Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49

      - name: Verify shared-modules recipe is vendored
        run: |
          test -f flatpak/shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json \
            || { echo "flatpak/shared-modules/ must be committed (see AGENTS.md Change 21)"; exit 1; }

      - name: Build Flatpak bundle
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --ccache \
            --repo=flatpak-repo \
            flatpak-build-dir \
            flatpak/com.framexshot.app.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak \
            com.framexshot.app

      - name: Validate Flatpak bundle
        run: |
          test -f framexshot_${{ env.APP_VERSION }}_amd64.flatpak
          flatpak install --user --noninteractive -y \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak
          flatpak info --show-ref com.framexshot.app

      - name: Upload Flatpak to release (best-effort)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak \
            --clobber || echo "Flatpak upload failed; release was still published."

  # ── Publish draft → public release ───────────────────────────────────────
  # Publishes as soon as the native build matrix succeeds. Flatpak is
  # best-effort (continue-on-error) and uploads separately when ready.
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const tagName = context.ref.replace('refs/tags/', '');
            const draftRelease = releases.find(r => r.draft && r.tag_name === tagName);

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                draft: false,
              });
              console.log(`Published release: ${draftRelease.html_url}`);
            } else {
              console.log(`No draft release found for tag: ${tagName}`);
            }
