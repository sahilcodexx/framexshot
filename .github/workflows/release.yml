name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Native packages: Linux (AppImage + .deb + .rpm, x86_64 + arm64), Windows (NSIS), macOS (DMG) ──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: .deb / .rpm / .AppImage. The AppImage we ship is a
          # Type 2 (always-extracts) — we inject a custom AppRun via
          # the "Inject custom AppRun" step below, which:
          #   1. Extracts the Tauri-built AppImage
          #   2. Replaces the default AppRun with one that extracts to
          #      $XDG_CACHE_HOME and re-execs from there
          #   3. Repackages as Type 2 so FUSE is never needed
          # This is the proper fix for the FUSE namespace WebKit issue
          # that broke the AppImage on COSMIC and other Wayland compositors.
          - platform: ubuntu-24.04
            args: --bundles appimage,deb,rpm
            arch: linux-x86_64
          - platform: ubuntu-24.04-arm
            args: --bundles appimage,deb,rpm
            arch: linux-arm64
          - platform: windows-latest
            args: ''
            arch: windows
          # macos-13 (Intel) runners are retired — build Intel via cross-target
          # on an Apple Silicon runner instead.
          - platform: macos-14
            args: --target x86_64-apple-darwin
            arch: macos-x86_64
          - platform: macos-14
            args: ''
            arch: macos-aarch64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Intel macOS cross-compile target
        if: matrix.arch == 'macos-x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev clang libclang-dev \
            file squashfs-tools libpipewire-0.3-dev libgbm-dev libdrm-dev \
            rpm xz-utils zstd xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version (asset names use the bare version, no "v")
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %s" --reverse)
          else
            COMMITS=$(git log "$PREV_TAG".."$TAG_NAME" --oneline --pretty=format:"- %s" --reverse)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- FrameXShot initial release"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FrameXShot ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads & Installation

            | Platform | Package | Notes |
            |----------|---------|-------|
            | **Linux (x86_64)** | `.AppImage`, `.deb`, `.rpm` | Type 2 AppImage — no FUSE needed |
            | **Linux (arm64)** | `.AppImage`, `.deb`, `.rpm` | Type 2 AppImage — no FUSE needed |
            | **Windows** | `*_x64-setup.exe` | standard installer |
            | **macOS (Intel)** | `*_x64.dmg` | macOS 10.15+ |
            | **macOS (Apple Silicon)** | `*_aarch64.dmg` | macOS 10.15+ |

            ### Linux — pick what fits your distro

            **AppImage** (universal, no install — no FUSE required):
            ```sh
            chmod +x framexshot_${{ env.APP_VERSION }}_amd64.AppImage
            ./framexshot_${{ env.APP_VERSION }}_amd64.AppImage
            ```
            First launch extracts the app to `~/.cache/framexshot/` and runs
            it from there — subsequent launches are instant. The extraction
            avoids the FUSE mount namespace that previously broke WebKit
            on COSMIC and other Wayland compositors.

            **Debian / Ubuntu / Pop!_OS / Mint / Elementary:**
            ```sh
            sudo apt install ./framexshot_${{ env.APP_VERSION }}_amd64.deb
            ```

            **Fedora / RHEL / Nobara / openSUSE:**
            ```sh
            sudo dnf install ./framexshot_${{ env.APP_VERSION }}_x86_64.rpm
            ```

            **Arch / Manjaro / EndeavourOS (AUR — recommended):**
            ```sh
            yay -S framexshot
            ```

            **Any other distro (builds from source against your system libs):**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/sahilcodexx/framexshot/main/packaging/install.sh | sh
            ```

            ### Windows
            ```sh
            framexshot_${{ env.APP_VERSION }}_x64-setup.exe
            ```

            ### macOS (Apple Silicon)
            ```sh
            open framexshot_${{ env.APP_VERSION }}_aarch64.dmg
            ```

            ### macOS (Intel)
            ```sh
            open framexshot_${{ env.APP_VERSION }}_x64.dmg
            ```

            ## What's New
            ${{ steps.release_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Convert the just-built Type 1 AppImage into a Type 2 (always-extracts)
      # and inject the self-extracting AppRun. This MUST run AFTER the
      # `tauri-apps/tauri-action@v0` build, because that action rebuilds the
      # AppImage from scratch and would otherwise overwrite our conversion.
      # The previous version (0b96076) had this step BEFORE the build, which
      # meant the conversion was silently discarded — the published artifact
      # was still the original Type 1 with garbled ELF padding.
      - name: Inject custom AppRun + convert AppImage to Type 2 (no FUSE)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          set -euo pipefail
          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
          for APPIMAGE in "$APPIMAGE_DIR"/*.AppImage; do
            [ -f "$APPIMAGE" ] || continue
            echo "→ Processing $APPIMAGE"

            WORK=$(mktemp -d)
            # 1. Extract the embedded SquashFS into a temp dir.
            #    unsquashfs on a Type 1 AppImage pulls the SquashFS contents
            #    (the app files, AppRun, etc.) out into WORK/extract.
            unsquashfs -d "$WORK/extract" "$APPIMAGE"

            # 2. Replace the default AppRun with our self-extracting one.
            #    It extracts to ~/.cache/framexshot/<ver>/ on first launch
            #    and re-execs the binary from there — bypassing the FUSE
            #    namespace that broke WebKit on COSMIC and other Wayland
            #    compositors.
            cp packaging/appimage/AppRun "$WORK/extract/AppRun"
            chmod +x "$WORK/extract/AppRun"

            # 3. Repackage as a pure SquashFS (Type 2 AppImage).
            #    A Type 2 AppImage is just a SquashFS with no ELF wrapper —
            #    the AppImage runtime always extracts it instead of FUSE-
            #    mounting, so no FUSE is needed on the user's system.
            mksquashfs "$WORK/extract" "$APPIMAGE.tmp" -noappend -comp xz -b 1M -all-root

            # 4. Replace the original
            mv "$APPIMAGE.tmp" "$APPIMAGE"
            rm -rf "$WORK"

            # 5. Verify the result
            FIRST4=$(head -c 4 "$APPIMAGE" | xxd -p)
            if [ "$FIRST4" = "68737173" ]; then
              echo "✓ Type 2 verified: $APPIMAGE starts with 'hsqs' (SquashFS magic)"
            else
              echo "✗ Conversion FAILED: $APPIMAGE first 4 bytes are $FIRST4 (expected 68737173)" >&2
              exit 1
            fi
          done

  # ── Build Flatpak bundle (universal Linux — bundles WebKitGTK via GNOME runtime) ──
  # Decoupled from publish: failure here will not block the AppImage/deb/rpm/dmg
  # release. Flatpak gets uploaded as a separate best-effort artifact.
  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev clang libclang-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev \
            ccache flatpak flatpak-builder

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version (asset names use the bare version, no "v")
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build frontend
        run: pnpm run build

      - name: Build Rust binary
        # cargo build embeds dist/ via generate_context!() at compile time.
        # The resulting binary is self-contained (frontend assets baked in).
        # --locked protects the committed Cargo.lock; --frozen (offline) is
        # avoided because fresh runners lack a cached crates.io index.
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      # Cache the GNOME SDK/Platform runtimes — first run ~2 GB download, then instant.
      # GNOME 49 platform: 48 is EOL (2026-04-11) — bump both the version AND
      # the cache key together or the stale cache will be reused.
      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-gnome-platform-49-v1

      # Cache Flatpak sources + ccache between runs.
      - name: Cache Flatpak build state
        uses: actions/cache@v4
        with:
          path: ~/.cache/flatpak-builder
          key: flatpak-builder-cache-49-${{ hashFiles('flatpak/**', 'src-tauri/Cargo.lock') }}

      - name: Install GNOME Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49

      - name: Verify shared-modules recipe is vendored
        run: |
          test -f flatpak/shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json \
            || { echo "flatpak/shared-modules/ must be committed (see AGENTS.md Change 21)"; exit 1; }

      - name: Build Flatpak bundle
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --ccache \
            --repo=flatpak-repo \
            flatpak-build-dir \
            flatpak/com.framexshot.app.yml

          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak \
            com.framexshot.app

      - name: Validate Flatpak bundle
        run: |
          test -f framexshot_${{ env.APP_VERSION }}_amd64.flatpak
          flatpak install --user --noninteractive -y \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak
          flatpak info --show-ref com.framexshot.app

      - name: Upload Flatpak to release (best-effort)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            framexshot_${{ env.APP_VERSION }}_amd64.flatpak \
            --clobber || echo "Flatpak upload failed; release was still published."

  # ── Publish draft → public release ───────────────────────────────────────
  # Publishes as soon as the native build matrix succeeds. Flatpak is
  # best-effort (continue-on-error) and uploads separately when ready.
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const tagName = context.ref.replace('refs/tags/', '');
            const draftRelease = releases.find(r => r.draft && r.tag_name === tagName);

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                draft: false,
              });
              console.log(`Published release: ${draftRelease.html_url}`);
            } else {
              console.log(`No draft release found for tag: ${tagName}`);
            }
