app-id: com.framexshot.app
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: framexshot

# The GNOME 47 runtime bundles libwebkit2gtk-4.1, GTK 3, GLib, etc.
# so users don't need ANY system library installed — works on every distro.

finish-args:
  # ── Display ─────────────────────────────────────────────────────────────
  - --share=ipc
  - --socket=x11        # X11 / XWayland
  - --socket=wayland    # native Wayland
  - --device=dri        # GPU access (WebKit renderer)

  # ── Filesystem ──────────────────────────────────────────────────────────
  - --filesystem=home          # save screenshots anywhere in home
  - --filesystem=/tmp          # temp directory for capture pipeline

  # ── D-Bus ───────────────────────────────────────────────────────────────
  - --socket=session-bus
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher       # tray icon (KDE/wlroots)
  - --talk-name=org.freedesktop.portal.Desktop      # xdg-desktop-portal
  - --talk-name=org.freedesktop.portal.FileChooser  # save dialog
  - --talk-name=org.freedesktop.portal.Screenshot   # screenshot via portal
  - --system-talk-name=org.freedesktop.login1

  # ── Runtime env ─────────────────────────────────────────────────────────
  # DMABuf renderer still disabled as a precaution; --device=dri handles GPU.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

modules:
  # ── libayatana-appindicator 0.5.94 + its deps (mirrors flathub/shared-modules) ─
  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      cflags: -Wno-error
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --enable-introspection=no
      - --disable-vala
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        mirror-urls:
          - https://sources.suse.com/SUSE:SLFO:Main:Build/libdbusmenu/a5b3e4717f09f90f9cd5568a5f933e8d/libdbusmenu-16.04.0.tar.gz
          - https://mirror.math.princeton.edu/pub/frugalware/frugalware-2.1/source/xlib/libdbusmenu/libdbusmenu-16.04.0.tar.gz
          - https://ftp.fr.openbsd.org/pub/OpenBSD/distfiles/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
      - type: patch
        paths:
          - 0001-Fix-HAVE_VALGRIND-AM_CONDITIONAL.patch

  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_INTROSPECTION=OFF
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: 0.10.4
        commit: f968079b09e12310fefc3fc307359025f1c74b3eb
      - type: patch
        paths:
          - 0001-Make-introspection-configurable.patch

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_INTROSPECTION=OFF
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: 0.9.4
        commit: 611bb384b73fa6311777ba4c41381a06f5b99dad

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_BINDINGS_MONO=OFF
      - -DENABLE_BINDINGS_VALA=OFF
      - -DENABLE_GTKDOC=OFF
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: 0.5.94
        commit: 31e8bb083b307e1cc96af4874a9470d27bd1e79

  - name: framexshot
    buildsystem: simple
    build-commands:
      - install -Dm755  framexshot   /app/bin/framexshot
      - install -Dm644  icon-128.png /app/share/icons/hicolor/128x128/apps/com.framexshot.app.png
      - install -Dm644  icon-32.png  /app/share/icons/hicolor/32x32/apps/com.framexshot.app.png
      - install -Dm644  com.framexshot.app.desktop /app/share/applications/com.framexshot.app.desktop
    sources:
      # Pre-built binary from the CI step above — no in-Flatpak compilation needed.
      - type: file
        path: ../src-tauri/target/release/framexshot
        dest-filename: framexshot
      - type: file
        path: ../src-tauri/icons/128x128.png
        dest-filename: icon-128.png
      - type: file
        path: ../src-tauri/icons/32x32.png
        dest-filename: icon-32.png
      - type: file
        path: com.framexshot.app.desktop
